<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JazzTaBueno Productions</title>
    <style>
        /* Reset básico y variables */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background-color: #0f0f0f; color: #fff; }

        /* --- CORRECCIÓN DE ENCUADRE DE IMAGEN --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 100vh;
            /* Asegúrate de poner la ruta real de tu imagen aquí */
            background-image: url('tu-imagen-saxofon.jpg'); 
            background-size: cover;
            background-position: center; /* En PC se ve centrada */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        /* Ajuste específico para móviles: movemos el foco de la imagen para revelar otros instrumentos */
        @media (max-width: 768px) {
            .hero-section {
                /* Cambia 'left' por 'right' dependiendo de qué lado de la foto estén los otros instrumentos */
                background-position: left center; 
            }
        }

        /* --- CORRECCIÓN DEL EFECTO FADE-IN --- */
        .fade-section {
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
            padding: 50px 20px;
            text-align: center;
        }

        .fade-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .btn {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            border-radius: 25px;
            background: transparent;
            border: 2px solid #b8860b;
            color: #b8860b;
            text-decoration: none;
            font-weight: bold;
        }
        
        .error-text {
            color: #ff3333;
            display: none; /* Oculto por defecto, se muestra si Firebase falla */
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <section class="hero-section">
        <h1>JAZZTABUENO PRODUCTIONS</h1>
        <p>El ritmo perfecto: La mejor selección de Jazz, Música Retro, Salsa y Rock.</p>
        <div>
            <a href="#" class="btn">📱 APP OFICIAL</a>
            <a href="#" class="btn">☁️ MIXCLOUD</a>
        </div>
    </section>

    <section class="fade-section" id="leyendas">
        <h2>Leyendas de la Música</h2>
        <p class="error-text" id="firebase-error">Error de conexión con Firebase.</p>
        <div id="firebase-data-container">
            <!-- Los datos de Firebase irán aquí -->
        </div>
    </section>

    <section class="fade-section">
        <h2>Nuestra Esencia</h2>
        <p>Somos un equipo de apasionados por el buen sonido. En JazzTaBueno Productions...</p>
    </section>

    <!-- Scripts separados para evitar que un error bloquee toda la página -->
    <script type="module">
        // 1. LÓGICA DE APARICIÓN CINEMATOGRÁFICA (Aislada de Firebase)
        document.addEventListener("DOMContentLoaded", () => {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.15
            };

            const observer = new IntersectionObserver((entries, observer) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.fade-section').forEach(section => {
                observer.observe(section);
            });
        });
    </script>

    <script type="module">
        // 2. LÓGICA DE FIREBASE (Con manejo de errores para que no rompa la UI)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.1.0/firebase-firestore.js";

        // TICO: Asegúrate de que estas variables coincidan exactamente con tu proyecto 
        // y estén declaradas en las variables de entorno de Vercel.
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_SENDER_ID",
            appId: "TU_APP_ID"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            
            // Función de prueba para verificar conexión
            async function testConnection() {
                try {
                    const querySnapshot = await getDocs(collection(db, "tu_coleccion"));
                    console.log("Conexión exitosa. Documentos:", querySnapshot.size);
                    // Aquí renderizas tus datos
                } catch (e) {
                    throw new Error("Permisos denegados o colección inexistente.");
                }
            }

            testConnection();

        } catch (error) {
            console.error("Fallo al inicializar Firebase:", error);
            // Mostramos el mensaje de error visualmente en vez de romper la página
            document.getElementById('firebase-error').style.display = 'block';
        }
    </script>
</body>
</html>
